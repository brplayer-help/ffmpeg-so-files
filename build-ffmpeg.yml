name: Build FFmpeg Libraries

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type of build to run (safe-core or custom)'
        required: true
        default: 'safe-core'
        type: choice
        options:
          - safe-core
          - custom
      architectures:
        description: 'Architectures to build (comma-separated: arm64-v8a, armeabi-v7a, x86_64, x86, or "all")'
        required: true
        default: 'arm64-v8a'
        type: string
      ndk_version:
        description: 'Android NDK version to use (e.g., r26b)'
        required: true
        default: 'r26b'
        type: string
      enable_dav1d:
        description: 'Enable and compile libdav1d AV1 software decoder'
        required: true
        default: true
        type: boolean
      custom_configure_flags:
        description: 'Custom FFmpeg configure flags (Only used when build_type is custom)'
        required: false
        default: ''
        type: string

jobs:
  setup:
    name: Setup Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Parse Inputs
        id: set-matrix
        run: |
          INPUT="${{ inputs.architectures }}"
          if [ "$INPUT" = "all" ]; then
            JSON='["arm64-v8a", "armeabi-v7a", "x86_64", "x86"]'
          else
            # Parse comma-separated list to JSON array
            JSON=$(echo "${INPUT}" | tr -d ' ' | jq -R 'split(",")' -c)
          fi
          echo "matrix=$JSON" >> $GITHUB_OUTPUT
          echo "Build Matrix generated: $JSON"

  build:
    name: Build FFmpeg (${{ matrix.architecture }})
    needs: setup
    runs-on: ubuntu-la19test
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJson(needs.setup.outputs.matrix) }}
        
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build nasm pkg-config zip cmake

      - name: Setup Android NDK
        run: |
          chmod +x ffmpeg-build/scripts/setup_ndk.sh
          ./ffmpeg-build/scripts/setup_ndk.sh ${{ inputs.ndk_version }}

      - name: Compile dav1d AV1 Decoder
        if: ${{ inputs.enable_dav1d }}
        run: |
          ARCH="${{ matrix.architecture }}"
          API=24
          
          # Map architectures to Meson conventions
          case $ARCH in
              arm64-v8a|arm64)
                  MESON_ARCH="arm64"
                  CPU_FAMILY="aarch64"
                  CPU="aarch64"
                  CROSS_PREFIX="aarch64-linux-android"
                  DIR_NAME="arm64"
                  ;;
              armeabi-v7a|arm)
                  MESON_ARCH="arm"
                  CPU_FAMILY="arm"
                  CPU="armv7-a"
                  CROSS_PREFIX="armv7a-linux-androideabi"
                  DIR_NAME="armeabi-v7a"
                  ;;
              x86_64)
                  MESON_ARCH="x86_64"
                  CPU_FAMILY="x86_64"
                  CPU="x86_64"
                  CROSS_PREFIX="x86_64-linux-android"
                  DIR_NAME="x86_64"
                  ;;
              x86)
                  MESON_ARCH="x86"
                  CPU_FAMILY="x86"
                  CPU="i686"
                  CROSS_PREFIX="i686-linux-android"
                  DIR_NAME="x86"
                  ;;
              *)
                  echo "Unsupported architecture for dav1d: $ARCH"
                  exit 1
                  ;;
          esac
          
          # Setup NDK Toolchain path
          export ANDROID_NDK_HOME="${HOME}/Android/Sdk/ndk/${{ inputs.ndk_version }}"
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="$TOOLCHAIN/bin:$PATH"
          
          # Generate temporary meson crossfile
          cat > /tmp/android-${ARCH}.meson << EOF
[binaries]
c = '${CROSS_PREFIX}${API}-clang'
cpp = '${CROSS_PREFIX}${API}-clang++'
ar = 'llvm-ar'
strip = 'llvm-strip'
pkgconfig = 'pkg-config'

[properties]
needs_exe_wrapper = true

[built-in options]
c_link_args = ['-Wl,-z,max-page-size=16384']
cpp_link_args = ['-Wl,-z,max-page-size=16384']

[host_machine]
system = 'android'
cpu_family = '${CPU_FAMILY}'
cpu = '${CPU}'
endian = 'little'
EOF
          
          echo "=== Meson Crossfile generated ==="
          cat /tmp/android-${ARCH}.meson
          echo "================================="
          
          cd ffmpeg-build/dav1d
          rm -rf build-android-${DIR_NAME}
          meson setup build-android-${DIR_NAME} --cross-file /tmp/android-${ARCH}.meson
          ninja -C build-android-${DIR_NAME}

      - name: Generate dav1d.pc pkg-config File
        if: ${{ inputs.enable_dav1d }}
        run: |
          ARCH="${{ matrix.architecture }}"
          if [ "$ARCH" = "arm64-v8a" ]; then
              DIR_NAME="arm64"
          else
              DIR_NAME="$ARCH"
          fi
          
          BUILD_ROOT="${{ github.workspace }}/ffmpeg-build"
          cat > "${BUILD_ROOT}/dav1d/dav1d.pc" << EOF
prefix=${BUILD_ROOT}/dav1d
includedir=\${prefix}/include
libdir=\${prefix}/build-android-${DIR_NAME}/src

Name: libdav1d
Description: AV1 decoding library
Version: 1.5.3
Libs: -L\${libdir} -ldav1d
Libs.private: 
Cflags: -I\${includedir}
EOF
          echo "=== Generated dav1d.pc ==="
          cat "${BUILD_ROOT}/dav1d/dav1d.pc"
          echo "=========================="

      - name: Compile and Package FFmpeg
        run: |
          export ANDROID_NDK_HOME="${HOME}/Android/Sdk/ndk/${{ inputs.ndk_version }}"
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="$TOOLCHAIN/bin:$PATH"
          
          BUILD_TYPE="${{ inputs.build_type }}"
          ARCH="${{ matrix.architecture }}"
          
          # Setup architectures parameters
          case $ARCH in
              arm64-v8a|arm64)
                  FF_ARCH="aarch64"
                  FF_CPU="armv8-a"
                  CROSS_PREFIX="aarch64-linux-android"
                  API=24
                  ABI_DIR="arm64-v8a"
                  EXTRA_CFLAGS="-march=armv8-a -mtune=cortex-a53"
                  EXTRA_CONFIGURE="--enable-neon"
                  ;;
              armeabi-v7a|arm|arm32)
                  FF_ARCH="arm"
                  FF_CPU="armv7-a"
                  CROSS_PREFIX="armv7a-linux-androideabi"
                  API=24
                  ABI_DIR="armeabi-v7a"
                  EXTRA_CFLAGS="-march=armv7-a -mfpu=neon -mtune=cortex-a8"
                  EXTRA_CONFIGURE="--enable-neon"
                  ;;
              x86_64)
                  FF_ARCH="x86_64"
                  FF_CPU="x86-64"
                  CROSS_PREFIX="x86_64-linux-android"
                  API=24
                  ABI_DIR="x86_64"
                  EXTRA_CFLAGS="-march=x86-64 -msse4.2"
                  EXTRA_CONFIGURE="--disable-x86asm"
                  ;;
              x86)
                  FF_ARCH="i686"
                  FF_CPU="i686"
                  CROSS_PREFIX="i686-linux-android"
                  API=24
                  ABI_DIR="x86"
                  EXTRA_CFLAGS="-march=i686 -msse3"
                  EXTRA_CONFIGURE="--disable-x86asm --disable-inline-asm"
                  ;;
          esac
          
          CC="${CROSS_PREFIX}${API}-clang"
          CXX="${CROSS_PREFIX}${API}-clang++"
          
          if [ "$BUILD_TYPE" = "safe-core" ]; then
              cd ffmpeg-build/scripts
              chmod +x package_safe_core.sh
              ./package_safe_core.sh "$ARCH"
          elif [ "$BUILD_TYPE" = "custom" ]; then
              cd ffmpeg-build/ffmpeg-8.1
              make clean || true
              make distclean || true
              
              # Force unversioned .so files
              sed -i "s/SLIBNAME_WITH_MAJOR='\$(SLIBNAME).\$(LIBMAJOR)'/SLIBNAME_WITH_MAJOR='\$(SLIBNAME)'/g" configure
              sed -i "s/SLIB_INSTALL_NAME='\$(SLIBNAME_WITH_VERSION)'/SLIB_INSTALL_NAME='\$(SLIBNAME)'/g" configure
              sed -i "s/SLIB_INSTALL_LINKS='\$(SLIBNAME_WITH_MAJOR) \$(SLIBNAME)'/SLIB_INSTALL_LINKS='\$(SLIBNAME)'/g" configure
              
              # Check dav1d
              if [ "$ARCH" = "arm64-v8a" ]; then
                  DIR_NAME="arm64"
              else
                  DIR_NAME="$ARCH"
              fi
              DAV1D_DIR="${{ github.workspace }}/ffmpeg-build/dav1d/build-android-${DIR_NAME}"
              DAV1D_INCLUDE="${{ github.workspace }}/ffmpeg-build/dav1d/include"
              
              USE_DAV1D="false"
              if [ -d "${DAV1D_DIR}/src" ]; then
                  USE_DAV1D="true"
              fi
              
              DAV1D_CONFIGURE_FLAG=""
              DAV1D_CFLAGS_FLAG=""
              DAV1D_LDFLAGS_FLAG=""
              if [ "$USE_DAV1D" = "true" ]; then
                  DAV1D_CONFIGURE_FLAG="--enable-libdav1d"
                  DAV1D_CFLAGS_FLAG="-I${DAV1D_INCLUDE}"
                  DAV1D_LDFLAGS_FLAG="-L${DAV1D_DIR}/src -ldav1d"
                  
                  if [ -f "${DAV1D_DIR}/include/dav1d/version.h" ]; then
                      cp "${DAV1D_DIR}/include/dav1d/version.h" "${DAV1D_INCLUDE}/dav1d/"
                  fi
              fi
              
              PKG_CONFIG_WRAPPER="${{ github.workspace }}/ffmpeg-build/scripts/pkg-config-dav1d.sh"
              
              # Run configure with custom configure flags
              ./configure \
                  --prefix="${{ github.workspace }}/ffmpeg-build/packages/custom/${ABI_DIR}" \
                  --enable-cross-compile \
                  --cross-prefix="${CROSS_PREFIX}${API}-" \
                  --nm=llvm-nm \
                  --ar=llvm-ar \
                  --strip=llvm-strip \
                  --ranlib=llvm-ranlib \
                  --target-os=android \
                  --arch=${FF_ARCH} \
                  --cpu=${FF_CPU} \
                  --cc=${CC} \
                  --cxx=${CXX} \
                  --pkg-config=${PKG_CONFIG_WRAPPER} \
                  --enable-shared \
                  --disable-static \
                  --disable-doc \
                  --disable-programs \
                  --disable-symver \
                  --enable-pic \
                  --enable-jni \
                  --enable-mediacodec \
                  --enable-asm \
                  --enable-inline-asm \
                  ${EXTRA_CONFIGURE} \
                  --enable-lto \
                  ${DAV1D_CONFIGURE_FLAG} \
                  --extra-cflags="-O3 -fPIC -DANDROID ${EXTRA_CFLAGS:-} ${DAV1D_CFLAGS_FLAG}" \
                  --extra-ldflags="-Wl,-z,max-page-size=16384 ${DAV1D_LDFLAGS_FLAG}" \
                  ${{ inputs.custom_configure_flags }}
              
              make -j$(nproc)
              make install
              
              # Copy libdav1d.so if needed
              if [ "$USE_DAV1D" = "true" ] && [ -f "${DAV1D_DIR}/src/libdav1d.so" ]; then
                  cp "${DAV1D_DIR}/src/libdav1d.so" "${{ github.workspace }}/ffmpeg-build/packages/custom/${ABI_DIR}/lib/"
              fi
              
              # Generate metadata.json
              LIB_DIR="${{ github.workspace }}/ffmpeg-build/packages/custom/${ABI_DIR}/lib"
              METADATA_FILE="${LIB_DIR}/metadata.json"
              BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              
              NEON_STATUS="false"
              if [[ "${ABI_DIR}" == "arm64-v8a" ]] || [[ "${ABI_DIR}" == "armeabi-v7a" ]]; then
                  NEON_STATUS="true"
              fi
              
              DAV1D_VERSION="unknown"
              if [ "$USE_DAV1D" = "true" ] && [ -f "${DAV1D_DIR}/meson-info/intro-projectinfo.json" ]; then
                  DAV1D_VERSION=$(grep -oP '"version": "\K[^"]+' "${DAV1D_DIR}/meson-info/intro-projectinfo.json" 2>/dev/null || echo "unknown")
              fi
              
              REQ_LIBS='"libavutil.so", "libswresample.so", "libavcodec.so", "libavformat.so", "libswscale.so", "libavfilter.so"'
              if [ "$USE_DAV1D" = "true" ]; then
                  REQ_LIBS="${REQ_LIBS}, \"libdav1d.so\""
              fi
              
              cat > "$METADATA_FILE" << EOF
{
    "format_version": 2,
    "ffmpeg_version": "8.1.2",
    "dav1d_version": "${DAV1D_VERSION}",
    "build_type": "custom",
    "build_label": "Custom Build (NEON Optimized)",
    "license": "Custom",
    "abi": "${ABI_DIR}",
    "build_date": "${BUILD_DATE}",
    "min_android_api": 24,
    "16kb_aligned": true,
    "neon_enabled": ${NEON_STATUS},
    "note": "Custom compiled libraries configured via custom arguments",
    "required_libraries": [
        ${REQ_LIBS}
    ]
}
EOF
              
              # Verify
              REQUIRED_LIBS=("libavutil.so" "libswresample.so" "libavcodec.so" "libavformat.so" "libswscale.so" "libavfilter.so")
              if [ "$USE_DAV1D" = "true" ]; then
                  REQUIRED_LIBS+=("libdav1d.so")
              fi
              for lib in "${REQUIRED_LIBS[@]}"; do
                  if [ ! -f "${LIB_DIR}/${lib}" ]; then
                      echo "ERROR: Missing ${lib}"
                      exit 1
                  fi
              done
              
              # Zip package
              cd "$LIB_DIR"
              zip -r "${{ github.workspace }}/ffmpeg-build/packages/custom/custom-${ABI_DIR}.zip" ./*.so ./metadata.json
          fi

      - name: Upload Zip Package
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ inputs.build_type }}-${{ matrix.architecture }}
          path: |
            ffmpeg-build/packages/**/*.zip
          retention-days: 14
