name: Build FFmpeg Libraries

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type of build to run (safe-core or custom)'
        required: true
        default: 'safe-core'
        type: choice
        options:
          - safe-core
          - custom
      architectures:
        description: 'Architectures to build (comma-separated: arm64-v8a, armeabi-v7a, x86_64, x86, or "all")'
        required: true
        default: 'arm64-v8a'
        type: string
      ndk_version:
        description: 'Android NDK version to use (e.g., r26b)'
        required: true
        default: 'r26b'
        type: string
      enable_dav1d:
        description: 'Enable and compile libdav1d AV1 software decoder'
        required: true
        default: true
        type: boolean
      custom_configure_flags:
        description: 'Custom FFmpeg configure flags (Only used when build_type is custom)'
        required: false
        default: ''
        type: string

jobs:
  setup:
    name: Setup Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Parse Inputs
        id: set-matrix
        run: |
          INPUT="${{ inputs.architectures }}"
          if [ "$INPUT" = "all" ]; then
            JSON='["arm64-v8a", "armeabi-v7a", "x86_64", "x86"]'
          else
            # Parse comma-separated list to JSON array
            JSON=$(echo "${INPUT}" | tr -d ' ' | jq -R 'split(",")' -c)
          fi
          echo "matrix=$JSON" >> $GITHUB_OUTPUT
          echo "Build Matrix generated: $JSON"

  build:
    name: Build FFmpeg (${{ matrix.architecture }})
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJson(needs.setup.outputs.matrix) }}
        
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build nasm yasm pkg-config zip unzip cmake wget git

      - name: Download and Extract Source Code
        run: |
          mkdir -p ffmpeg-build
          cd ffmpeg-build
          
          # Download FFmpeg 8.1.2 if not present
          if [ ! -d "ffmpeg-8.1" ]; then
              echo "Downloading FFmpeg 8.1.2..."
              wget -q https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz
              tar -xf ffmpeg-8.1.2.tar.xz
              mv ffmpeg-8.1.2 ffmpeg-8.1
              rm -f ffmpeg-8.1.2.tar.xz
          fi
          
          # Clone dav1d 1.5.3 if not present
          if [ "${{ inputs.enable_dav1d }}" = "true" ] && [ ! -d "dav1d" ]; then
              echo "Cloning dav1d 1.5.3..."
              git clone --branch 1.5.3 --depth 1 https://code.videolan.org/videolan/dav1d.git
          fi

      - name: Setup Android NDK
        run: |
          VERSION="${{ inputs.ndk_version }}"
          NDK_INSTALL_DIR="${HOME}/Android/Sdk/ndk"
          NDK_DIR="${NDK_INSTALL_DIR}/${VERSION}"
          
          if [ -d "$NDK_DIR" ]; then
              echo "NDK ${VERSION} already installed."
          else
              echo "Downloading Android NDK ${VERSION}..."
              mkdir -p "$NDK_INSTALL_DIR"
              ZIP_FILE="/tmp/android-ndk-${VERSION}.zip"
              wget -q -O "$ZIP_FILE" "https://dl.google.com/android/repository/android-ndk-${VERSION}-linux.zip"
              echo "Extracting NDK..."
              unzip -q "$ZIP_FILE" -d "$NDK_INSTALL_DIR"
              if [ -d "${NDK_INSTALL_DIR}/android-ndk-${VERSION}" ]; then
                  mv "${NDK_INSTALL_DIR}/android-ndk-${VERSION}" "$NDK_DIR"
              fi
              rm -f "$ZIP_FILE"
          fi

      - name: Generate pkg-config Wrapper
        if: ${{ inputs.enable_dav1d }}
        run: |
          mkdir -p ffmpeg-build/scripts
          cat > ffmpeg-build/scripts/pkg-config-dav1d.sh << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export PKG_CONFIG_LIBDIR="${SCRIPT_DIR}/../dav1d"
          export PKG_CONFIG_PATH=""
          exec /usr/bin/pkg-config "$@"
          EOF
          chmod +x ffmpeg-build/scripts/pkg-config-dav1d.sh

      - name: Compile dav1d AV1 Decoder
        if: ${{ inputs.enable_dav1d }}
        run: |
          ARCH="${{ matrix.architecture }}"
          API=24
          
          # Map architectures to Meson conventions
          case $ARCH in
              arm64-v8a|arm64)
                  MESON_ARCH="arm64"
                  CPU_FAMILY="aarch64"
                  CPU="aarch64"
                  CROSS_PREFIX="aarch64-linux-android"
                  DIR_NAME="arm64"
                  ;;
              armeabi-v7a|arm)
                  MESON_ARCH="arm"
                  CPU_FAMILY="arm"
                  CPU="armv7-a"
                  CROSS_PREFIX="armv7a-linux-androideabi"
                  DIR_NAME="armeabi-v7a"
                  ;;
              x86_64)
                  MESON_ARCH="x86_64"
                  CPU_FAMILY="x86_64"
                  CPU="x86_64"
                  CROSS_PREFIX="x86_64-linux-android"
                  DIR_NAME="x86_64"
                  ;;
              x86)
                  MESON_ARCH="x86"
                  CPU_FAMILY="x86"
                  CPU="i686"
                  CROSS_PREFIX="i686-linux-android"
                  DIR_NAME="x86"
                  ;;
              *)
                  echo "Unsupported architecture for dav1d: $ARCH"
                  exit 1
                  ;;
          esac
          
          # Setup NDK Toolchain path
          export ANDROID_NDK_HOME="${HOME}/Android/Sdk/ndk/${{ inputs.ndk_version }}"
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="$TOOLCHAIN/bin:$PATH"
          
          # Generate temporary meson crossfile
          cat > /tmp/android-${ARCH}.meson << EOF
          [binaries]
          c = '${CROSS_PREFIX}${API}-clang'
          cpp = '${CROSS_PREFIX}${API}-clang++'
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          pkgconfig = 'pkg-config'

          [properties]
          needs_exe_wrapper = true

          [built-in options]
          c_link_args = ['-Wl,-z,max-page-size=16384']
          cpp_link_args = ['-Wl,-z,max-page-size=16384']

          [host_machine]
          system = 'android'
          cpu_family = '${CPU_FAMILY}'
          cpu = '${CPU}'
          endian = 'little'
          EOF
          
          echo "=== Meson Crossfile generated ==="
          cat /tmp/android-${ARCH}.meson
          echo "================================="
          
          cd ffmpeg-build/dav1d
          rm -rf build-android-${DIR_NAME}
          meson setup build-android-${DIR_NAME} --cross-file /tmp/android-${ARCH}.meson
          ninja -C build-android-${DIR_NAME}

      - name: Generate dav1d.pc pkg-config File
        if: ${{ inputs.enable_dav1d }}
        run: |
          ARCH="${{ matrix.architecture }}"
          if [ "$ARCH" = "arm64-v8a" ]; then
              DIR_NAME="arm64"
          else
              DIR_NAME="$ARCH"
          fi
          
          BUILD_ROOT="${{ github.workspace }}/ffmpeg-build"
          cat > "${BUILD_ROOT}/dav1d/dav1d.pc" << EOF
          prefix=${BUILD_ROOT}/dav1d
          includedir=\${prefix}/include
          libdir=\${prefix}/build-android-${DIR_NAME}/src

          Name: libdav1d
          Description: AV1 decoding library
          Version: 1.5.3
          Libs: -L\${libdir} -ldav1d
          Libs.private: 
          Cflags: -I\${includedir}
          EOF
          echo "=== Generated dav1d.pc ==="
          cat "${BUILD_ROOT}/dav1d/dav1d.pc"
          echo "=========================="

      - name: Compile and Package FFmpeg
        run: |
          export ANDROID_NDK_HOME="${HOME}/Android/Sdk/ndk/${{ inputs.ndk_version }}"
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="$TOOLCHAIN/bin:$PATH"
          
          BUILD_TYPE="${{ inputs.build_type }}"
          ARCH="${{ matrix.architecture }}"
          
          # Setup architectures parameters
          case $ARCH in
              arm64-v8a|arm64)
                  FF_ARCH="aarch64"
                  FF_CPU="armv8-a"
                  CROSS_PREFIX="aarch64-linux-android"
                  API=24
                  ABI_DIR="arm64-v8a"
                  EXTRA_CFLAGS="-march=armv8-a -mtune=cortex-a53"
                  EXTRA_CONFIGURE="--enable-neon"
                  ;;
              armeabi-v7a|arm|arm32)
                  FF_ARCH="arm"
                  FF_CPU="armv7-a"
                  CROSS_PREFIX="armv7a-linux-androideabi"
                  API=24
                  ABI_DIR="armeabi-v7a"
                  EXTRA_CFLAGS="-march=armv7-a -mfpu=neon -mtune=cortex-a8"
                  EXTRA_CONFIGURE="--enable-neon"
                  ;;
              x86_64)
                  FF_ARCH="x86_64"
                  FF_CPU="x86-64"
                  CROSS_PREFIX="x86_64-linux-android"
                  API=24
                  ABI_DIR="x86_64"
                  EXTRA_CFLAGS="-march=x86-64 -msse4.2"
                  EXTRA_CONFIGURE="--disable-x86asm"
                  ;;
              x86)
                  FF_ARCH="i686"
                  FF_CPU="i686"
                  CROSS_PREFIX="i686-linux-android"
                  API=24
                  ABI_DIR="x86"
                  EXTRA_CFLAGS="-march=i686 -msse3"
                  EXTRA_CONFIGURE="--disable-x86asm --disable-inline-asm"
                  ;;
          esac
          
          CC="${CROSS_PREFIX}${API}-clang"
          CXX="${CROSS_PREFIX}${API}-clang++"
          
          OUT_DIR_NAME="safe-core"
          EXTRA_CUSTOM_FLAGS=""
          if [ "$BUILD_TYPE" = "custom" ]; then
              OUT_DIR_NAME="custom"
              EXTRA_CUSTOM_FLAGS="${{ inputs.custom_configure_flags }}"
          fi
          
          cd ffmpeg-build/ffmpeg-8.1
          make clean || true
          make distclean || true
          
          # Force unversioned .so files
          sed -i "s/SLIBNAME_WITH_MAJOR='\$(SLIBNAME).\$(LIBMAJOR)'/SLIBNAME_WITH_MAJOR='\$(SLIBNAME)'/g" configure
          sed -i "s/SLIB_INSTALL_NAME='\$(SLIBNAME_WITH_VERSION)'/SLIB_INSTALL_NAME='\$(SLIBNAME)'/g" configure
          sed -i "s/SLIB_INSTALL_LINKS='\$(SLIBNAME_WITH_MAJOR) \$(SLIBNAME)'/SLIB_INSTALL_LINKS='\$(SLIBNAME)'/g" configure
          
          # Check dav1d
          if [ "$ARCH" = "arm64-v8a" ]; then
              DIR_NAME="arm64"
          else
              DIR_NAME="$ARCH"
          fi
          DAV1D_DIR="${{ github.workspace }}/ffmpeg-build/dav1d/build-android-${DIR_NAME}"
          DAV1D_INCLUDE="${{ github.workspace }}/ffmpeg-build/dav1d/include"
          
          USE_DAV1D="false"
          if [ -d "${DAV1D_DIR}/src" ]; then
              USE_DAV1D="true"
          fi
          
          DAV1D_CONFIGURE_FLAG=""
          DAV1D_DECODER_FLAG=""
          DAV1D_CFLAGS_FLAG=""
          DAV1D_LDFLAGS_FLAG=""
          if [ "$USE_DAV1D" = "true" ]; then
              DAV1D_CONFIGURE_FLAG="--enable-libdav1d"
              DAV1D_DECODER_FLAG=",libdav1d"
              DAV1D_CFLAGS_FLAG="-I${DAV1D_INCLUDE}"
              DAV1D_LDFLAGS_FLAG="-L${DAV1D_DIR}/src -ldav1d"
              
              if [ -f "${DAV1D_DIR}/include/dav1d/version.h" ]; then
                  cp "${DAV1D_DIR}/include/dav1d/version.h" "${DAV1D_INCLUDE}/dav1d/"
              fi
          fi
          
          PKG_CONFIG_WRAPPER="${{ github.workspace }}/ffmpeg-build/scripts/pkg-config-dav1d.sh"
          
          # Run configure with custom configure flags starting from the safe-core baseline
          ./configure \
              --prefix="${{ github.workspace }}/ffmpeg-build/packages/${OUT_DIR_NAME}/${ABI_DIR}" \
              --enable-cross-compile \
              --cross-prefix="${CROSS_PREFIX}${API}-" \
              --nm=llvm-nm \
              --ar=llvm-ar \
              --strip=llvm-strip \
              --ranlib=llvm-ranlib \
              --target-os=android \
              --arch=${FF_ARCH} \
              --cpu=${FF_CPU} \
              --cc=${CC} \
              --cxx=${CXX} \
              --pkg-config=${PKG_CONFIG_WRAPPER} \
              --enable-shared \
              --disable-static \
              --disable-doc \
              --disable-programs \
              --disable-symver \
              --enable-pic \
              --enable-jni \
              --enable-mediacodec \
              --enable-asm \
              --enable-inline-asm \
              ${EXTRA_CONFIGURE} \
              --enable-lto \
              ${DAV1D_CONFIGURE_FLAG} \
              --disable-gpl \
              --disable-nonfree \
              --disable-decoders \
              --disable-encoders \
              --enable-encoder=aac,opus,vorbis,flac,alac,pcm_s16le,pcm_s24le,pcm_f32le \
              --disable-parsers \
              --disable-demuxers \
              --disable-muxers \
              --disable-bsfs \
              --disable-filters \
              --enable-filter=aformat,anull,atrim,format,null,trim,scale,volume \
              --enable-decoder=opus,vorbis,flac,alac,mp3,mp2,mp1,aac,aac_latm,ac3 \
              --enable-decoder=pcm_s16le,pcm_s16be,pcm_s24le,pcm_s24be,pcm_s32le,pcm_f32le,pcm_f64le \
              --enable-decoder=pcm_mulaw,pcm_alaw,pcm_u8,pcm_s8 \
              --enable-decoder=wavpack,ape \
              --enable-decoder=vp8,vp9${DAV1D_DECODER_FLAG},theora,h264,hevc \
              --disable-decoder=eac3 \
              --enable-decoder=mjpeg,rawvideo,gif,png,webp,bmp \
              --enable-parser=opus,vorbis,flac,vp8,vp9,av1,mpegaudio,aac,aac_latm,ac3,h264,hevc \
              --enable-demuxer=ogg,flac,wav,matroska,webm,mp3,gif,apng,image2,concat,mov,mp4,m4v,avi \
              --enable-muxer=matroska,webm,mp4,mov,ogg,flac,wav,null,ipod,adts \
              --enable-protocol=file,http,https,concat,data,pipe \
              --enable-swresample \
              --enable-swscale \
              --extra-cflags="-O3 -fPIC -DANDROID ${EXTRA_CFLAGS:-} ${DAV1D_CFLAGS_FLAG}" \
              --extra-ldflags="-Wl,-z,max-page-size=16384 ${DAV1D_LDFLAGS_FLAG}" \
              ${EXTRA_CUSTOM_FLAGS}
          
          make -j$(nproc)
          make install
          
          # Copy libdav1d.so if needed
          if [ "$USE_DAV1D" = "true" ] && [ -f "${DAV1D_DIR}/src/libdav1d.so" ]; then
              cp "${DAV1D_DIR}/src/libdav1d.so" "${{ github.workspace }}/ffmpeg-build/packages/${OUT_DIR_NAME}/${ABI_DIR}/lib/"
          fi
          
          # Generate metadata.json
          LIB_DIR="${{ github.workspace }}/ffmpeg-build/packages/${OUT_DIR_NAME}/${ABI_DIR}/lib"
          METADATA_FILE="${LIB_DIR}/metadata.json"
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          NEON_STATUS="false"
          if [[ "${ABI_DIR}" == "arm64-v8a" ]] || [[ "${ABI_DIR}" == "armeabi-v7a" ]]; then
              NEON_STATUS="true"
          fi
          
          DAV1D_VERSION="unknown"
          if [ "$USE_DAV1D" = "true" ] && [ -f "${DAV1D_DIR}/meson-info/intro-projectinfo.json" ]; then
              DAV1D_VERSION=$(grep -oP '"version": "\K[^"]+' "${DAV1D_DIR}/meson-info/intro-projectinfo.json" 2>/dev/null || echo "unknown")
          fi
          
          REQ_LIBS='"libavutil.so", "libswresample.so", "libavcodec.so", "libavformat.so", "libswscale.so", "libavfilter.so"'
          if [ "$USE_DAV1D" = "true" ]; then
              REQ_LIBS="${REQ_LIBS}, \"libdav1d.so\""
          fi
          
          cat > "$METADATA_FILE" << EOF
          {
              "format_version": 2,
              "ffmpeg_version": "8.1.2",
              "dav1d_version": "${DAV1D_VERSION}",
              "build_type": "${OUT_DIR_NAME}",
              "build_label": "${OUT_DIR_NAME} Build (NEON Optimized)",
              "license": "Custom",
              "abi": "${ABI_DIR}",
              "build_date": "${BUILD_DATE}",
              "min_android_api": 24,
              "16kb_aligned": true,
              "neon_enabled": ${NEON_STATUS},
              "note": "Compiled libraries configured via automated CI workflow",
              "required_libraries": [
                  ${REQ_LIBS}
              ]
          }
          EOF
          
          # Build ffmpegJNI library
          JNI_SRC="${{ github.workspace }}/app/src/main/cpp/ffmpeg_jni.cpp"
          if [ -f "$JNI_SRC" ]; then
              echo "Building ffmpegJNI for ${OUT_DIR_NAME} build..."
              BUILD_DIR="${{ github.workspace }}/ffmpeg-build/packages/${OUT_DIR_NAME}/${ABI_DIR}/jni_build"
              mkdir -p "$BUILD_DIR"
              cd "$BUILD_DIR"
              
              TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake"
              cmake \
                  -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE" \
                  -DANDROID_ABI="$ABI_DIR" \
                  -DANDROID_PLATFORM=android-${API} \
                  -DANDROID_STL=c++_shared \
                  -DFFMPEG_ROOT="${{ github.workspace }}/ffmpeg-build/packages/${OUT_DIR_NAME}/${ABI_DIR}" \
                  -DJNI_SRC_DIR="$(dirname $JNI_SRC)" \
                  -DCMAKE_BUILD_TYPE=Release \
                  "${{ github.workspace }}/ffmpeg-build/jni"
                  
              make -j$(nproc)
              
              if [ -f "libffmpegJNI.so" ]; then
                  cp libffmpegJNI.so "$LIB_DIR/"
                  "${TOOLCHAIN}/bin/llvm-strip" "$LIB_DIR/libffmpegJNI.so" 2>/dev/null || true
                  echo "✓ Built and stripped libffmpegJNI.so"
              else
                  echo "WARNING: Failed to build libffmpegJNI.so"
              fi
              cd "$LIB_DIR"
          fi
          
          # Verify
          REQUIRED_LIBS=("libavutil.so" "libswresample.so" "libavcodec.so" "libavformat.so" "libswscale.so" "libavfilter.so")
          if [ "$USE_DAV1D" = "true" ]; then
              REQUIRED_LIBS+=("libdav1d.so")
          fi
          for lib in "${REQUIRED_LIBS[@]}"; do
              if [ ! -f "${LIB_DIR}/${lib}" ]; then
                  echo "ERROR: Missing ${lib}"
                  exit 1
              fi
          done
          
          # Zip package
          cd "$LIB_DIR"
          zip -r "${{ github.workspace }}/ffmpeg-build/packages/${OUT_DIR_NAME}/${OUT_DIR_NAME}-${ABI_DIR}.zip" ./*.so ./metadata.json

      - name: Upload Zip Package
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ inputs.build_type }}-${{ matrix.architecture }}
          path: |
            ffmpeg-build/packages/*/${{ matrix.architecture }}/lib/*.so
            ffmpeg-build/packages/*/${{ matrix.architecture }}/lib/metadata.json
          retention-days: 14
